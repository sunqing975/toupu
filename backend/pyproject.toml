[project]
name = "toupu-backend"
version = "0.1.0"
description = "投谱 Toupu - 个人投资资产管理与决策系统后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008：FastAPI 依赖注入的标准写法（Depends 作为参数默认值）
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
