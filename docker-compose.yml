services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: toupu
      POSTGRES_PASSWORD: toupu_dev
      POSTGRES_DB: toupu
    volumes:
      # PG18+ 镜像要求挂载 /var/lib/postgresql，数据存于版本化子目录，便于 pg_upgrade
      - pgdata:/var/lib/postgresql
    ports:
      - "5433:5432" # 宿主机 5432 常被本地 Postgres 占用，容器内部仍是 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toupu"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    # 开发默认只起数据库；完整容器化部署用 --profile full
    profiles: ["full"]
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://toupu:toupu_dev@db:5432/toupu
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles: ["full"]
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
